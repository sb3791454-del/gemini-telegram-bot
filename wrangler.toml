name = "gemini-telegram-bot"
main = "src/entry.py"
compatibility_date = "2024-04-03"
compatibility_flags = ["python_workers"]

[triggers]
crons = ["*/2 * * * *"]

# Cloudflare D1 Database Binding for Sultan Assistant State, Memory & Alerts
# database_name = "sultan-assistant-db"
# database_id = "6a9f3dad-24b8-4b0a-810a-b7733a664c85"

# Cloudflare Workers Secrets:
# - TELEGRAM_BOT_TOKEN
# - GEMINI_API_KEY
# - ALLOWED_USER_IDS (required: comma-separated numeric Telegram user IDs for private access)
# - WEBHOOK_SECRET (optional: for secure Telegram header verification)
# - SETUP_SECRET (optional: for securing the /set_webhook endpoint)
# - GEMINI_MODEL (optional: defaults to gemini-3.1-flash-lite)
